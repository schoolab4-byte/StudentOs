<!DOCTYPE html>
<html>
<head>
    <title>StudentOS</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="header">
    <h1>🚀 StudentOS</h1>
    <p>Your Complete Digital Space for Learning</p>

    <button onclick="changeTheme()">🌙 Change Theme</button>
    
</div>


<div class="container">

    <div class="card">

<h2>📊 My Dashboard</h2>

<input id="taskInput" placeholder="Enter your task">

<button onclick="addTask()">Add Task</button>

<div id="taskList"></div>

</div>
<div class="card">

<h2>🧮 Calculator</h2>

<input id="display" type="text" readonly>

<div class="buttons">

<button onclick="add('7')">7</button>
<button onclick="add('8')">8</button>
<button onclick="add('9')">9</button>
<button onclick="add('/')">÷</button>

<button onclick="add('4')">4</button>
<button onclick="add('5')">5</button>
<button onclick="add('6')">6</button>
<button onclick="add('*')">×</button>

<button onclick="add('1')">1</button>
<button onclick="add('2')">2</button>
<button onclick="add('3')">3</button>
<button onclick="add('-')">−</button>

<button onclick="add('0')">0</button>
<button onclick="clearDisplay()">C</button>
<button onclick="calculate()">=</button>
<button onclick="add('+')">+</button>

</div>

</div>


<div class="card">

<h2>🧠 Quiz Arena</h2>

<p id="question">Question will appear here</p>

<button onclick="answer(0)" id="option1">Option 1</button>
<button onclick="answer(1)" id="option2">Option 2</button>
<button onclick="answer(2)" id="option3">Option 3</button>
<button onclick="answer(3)" id="option4">Option 4</button>

<h3 id="score">Score: 0</h3>

</div>


<div class="card">
<h2>⏰ Digital Clock</h2>
<p id="clock">00:00:00</p>
</div>


<div class="card">

<h2>📝 My Notes</h2>

<input id="noteTitle" placeholder="Note Title">

<textarea id="noteText" placeholder="Write your notes..."></textarea>

<button onclick="saveNote()">Save</button>

<div id="savedNotes"></div>

</div>


</div>


<script src="script.js"></script>

</body>
</html>
